name: Build

on:
  pull_request:

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Build App
        run: |
          xcodebuild -project uttr.xcodeproj \
            -scheme uttr \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check Logger
        run: |
          swiftc Swift/Logger.swift Tests/LoggerChecks.swift -o "$RUNNER_TEMP/uttr-logger-checks"
          "$RUNNER_TEMP/uttr-logger-checks"

      - name: Check History
        run: |
          swiftc Swift/Logger.swift Swift/HistoryManager.swift Tests/HistoryChecks.swift -o "$RUNNER_TEMP/uttr-history-checks"
          "$RUNNER_TEMP/uttr-history-checks"

      - name: Check Cleanup
        run: |
          swiftc -parse-as-library Swift/Cleanup/TextCleanup.swift Swift/Cleanup/CleanupOutputChecks.swift \
            Tests/CleanupEngineChecks.swift -o "$RUNNER_TEMP/uttr-cleanup-checks"
          "$RUNNER_TEMP/uttr-cleanup-checks"

      - name: Check Selection
        run: |
          swiftc Swift/Logger.swift Swift/Selection/SelectionReader.swift Tests/SelectionChecks.swift -o "$RUNNER_TEMP/uttr-selection-checks"
          "$RUNNER_TEMP/uttr-selection-checks"

      - name: Check Speech
        run: |
          swiftc -parse-as-library Swift/Logger.swift Swift/HistoryManager.swift Swift/Selection/SelectionReader.swift \
            Swift/Speech/SpeechEngine.swift Swift/Speech/SystemSpeechEngine.swift Swift/Speech/ReadAloud.swift \
            Swift/Speech/SpeechChunks.swift Tests/SpeechChecks.swift -o "$RUNNER_TEMP/uttr-speech-checks"
          "$RUNNER_TEMP/uttr-speech-checks"

      - name: Check Speech Pipeline
        run: |
          swiftc -parse-as-library Swift/Logger.swift Swift/Speech/SpeechEngine.swift Swift/Speech/SpeechPipeline.swift \
            Tests/SpeechPipelineChecks.swift -o "$RUNNER_TEMP/uttr-pipeline-checks"
          "$RUNNER_TEMP/uttr-pipeline-checks"

      - name: Check mlx-audio Runtime
        run: |
          swiftc -parse-as-library Swift/Logger.swift Swift/Speech/SpeechEngine.swift Swift/Speech/SpeechPipeline.swift \
            Swift/Speech/SpeechChunks.swift Swift/Speech/SpeechModels.swift Swift/Speech/WAVDecoder.swift \
            Swift/Speech/MLXAudioRuntime.swift Swift/Speech/MLXAudioInstaller.swift Swift/Speech/MLXSpeechEngine.swift \
            Tests/MLXAudioChecks.swift -o "$RUNNER_TEMP/uttr-mlx-checks"
          "$RUNNER_TEMP/uttr-mlx-checks"

      - name: Check mlx-audio Worker
        run: |
          python3 -m venv "$RUNNER_TEMP/worker-venv"
          "$RUNNER_TEMP/worker-venv/bin/pip" install --quiet numpy
          "$RUNNER_TEMP/worker-venv/bin/python" Tests/mlx_audio_worker_checks.py
