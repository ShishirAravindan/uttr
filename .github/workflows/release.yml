name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increase
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version (X.Y.Z), used instead of the bump
        type: string
        required: false
      title:
        description: Release title; defaults to the latest merged PR's title
        type: string
        required: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Release
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          REQUESTED: ${{ inputs.version }}
        run: |
          LATEST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          LATEST=${LATEST:-v0.0.0}
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          REQUESTED="${REQUESTED#v}"

          if [ -n "$REQUESTED" ]; then
            if ! [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must look like 1.2.3, got '$REQUESTED'"
              exit 1
            fi
            IFS=. read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "$REQUESTED"
            if (( NEW_MAJOR < MAJOR || (NEW_MAJOR == MAJOR && (NEW_MINOR < MINOR || (NEW_MINOR == MINOR && NEW_PATCH <= PATCH))) )); then
              echo "::error::$REQUESTED is not newer than $LATEST"
              exit 1
            fi
            VERSION="$REQUESTED"
          else
            case "$BUMP" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              *)     VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists"
            exit 1
          fi

          echo "Releasing v$VERSION (previous: $LATEST)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Name release
        id: name
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.title }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          TITLE="$REQUESTED"
          if [ -z "$TITLE" ]; then
            TITLE=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state merged --limit 30 \
              --json title,mergedAt --jq 'sort_by(.mergedAt) | last | .title // ""')
            TITLE=$(sed -E 's/^[a-z]+(\([^)]*\))?!?: //' <<< "$TITLE")
            TITLE="$(tr '[:lower:]' '[:upper:]' <<< "${TITLE:0:1}")${TITLE:1}"
          fi

          NAME="uttr $TAG"
          if [ -n "$TITLE" ]; then
            NAME="$NAME: $TITLE"
          fi
          echo "Release name: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Build App
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project uttr.xcodeproj \
            -scheme uttr \
            -configuration Release \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check stamped version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PLIST="$RUNNER_TEMP/DerivedData/Build/Products/Release/uttr.app/Contents/Info.plist"
          STAMPED=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          if [ "$STAMPED" != "$VERSION" ]; then
            echo "::error::App reports version $STAMPED, expected $VERSION"
            exit 1
          fi

      - name: Create ZIP
        run: |
          cd $RUNNER_TEMP/DerivedData/Build/Products/Release
          zip -r $RUNNER_TEMP/uttr.zip uttr.app

      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 $RUNNER_TEMP/uttr.zip | awk '{print $1}')
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Tag release
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.name.outputs.name }}
          files: ${{ runner.temp }}/uttr.zip
          body: |
            ## Installation

            ### Homebrew (Recommended)
            ```bash
            brew tap ShishirAravindan/tap
            brew install --cask uttr
            ```

            ### Manual Download
            1. Download `uttr.zip` below
            2. Unzip and move to Applications
            3. On first launch: System Settings → Privacy & Security → Open Anyway

            ## SHA256
            ```
            ${{ steps.sha.outputs.sha256 }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ShishirAravindan/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Bump cask version and sha256
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          sed -i '' "s/version \".*\"/version \"$VERSION\"/" homebrew-tap/Casks/uttr.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${{ steps.sha.outputs.sha256 }}\"/" homebrew-tap/Casks/uttr.rb

      - name: Open PR in tap repo
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          commit-message: "chore: bump uttr to ${{ steps.tag.outputs.tag }}"
          title: ${{ steps.name.outputs.name }}
          body: "Automated cask update for release [${{ steps.tag.outputs.tag }}](https://github.com/ShishirAravindan/uttr/releases/tag/${{ steps.tag.outputs.tag }})."
          branch: "bump/uttr-${{ steps.tag.outputs.tag }}"
